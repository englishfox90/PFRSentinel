name: Bug report
description: Something in PFR Sentinel is not working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: PFR Sentinel version
      description: Shown in the title bar and in Settings.
      placeholder: "3.7.6"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Capture mode
      options:
        - ZWO camera
        - Directory watch (NINA or other software)
        - Not sure / not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: |
        Paste the relevant part of `%APPDATA%\PFRSentinel\logs\sentinel.log`, or attach the ZIP from
        **Export Diagnostics** on the Logs tab if your version has it. The bundle redacts webhook URLs and API keys.
      render: text
  - type: input
    id: camera
    attributes:
      label: Camera and setup
      placeholder: "ASI676MC, all-sky lens, Windows 11"
