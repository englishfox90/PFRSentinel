name: GitHub Releases to Discord

on:
  release:
    types: [published]
  # Manual test path: post a fake release without cutting a real one.
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title to post
        required: true
      release_body:
        description: Release notes body to post
        required: true
      release_html_url:
        description: Release URL to link in Discord
        required: false

permissions:
  contents: read

jobs:
  github-releases-to-discord:
    # The rolling dev prerelease (build.yml publish-dev) is replaced on every
    # publish; announcing each one would flood the channel. It is created with
    # GITHUB_TOKEN, which fires no release event today, so this only matters
    # if that changes or someone republishes it by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'dev-latest'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2696771"
          username: "PFR Sentinel Releases"
          avatar_url: "https://raw.githubusercontent.com/englishfox90/PFRSentinel/main/assets/app_icon.png"
          footer_title: "PFR Sentinel"
          footer_icon_url: "https://raw.githubusercontent.com/englishfox90/PFRSentinel/main/assets/app_icon.png"
          footer_timestamp: true
          reduce_headings: true
          release_name: ${{ inputs.release_name }}
          release_body: ${{ inputs.release_body }}
          release_html_url: ${{ inputs.release_html_url }}
