name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and size audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tooling
        run: python -m pip install --quiet ruff
      - name: Ruff (syntax errors, undefined names, redefinitions)
        run: ruff check --output-format github .
      - name: File size caps
        run: python scripts/ci/check_file_sizes.py

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Job names are spelled out per entry rather than built from a suffix,
        # because main's ruleset requires all three by their exact strings.
        # Renaming one leaves that required check "Expected — waiting for
        # status to be reported" forever, which blocks every merge. Don't
        # rename these without updating the ruleset in the same change.
        #
        # The Windows name is longer because pip-audit runs on that job alone,
        # so it is the only one auditing dependencies.
        include:
          - os: windows-latest
            name: Tests and dependency audit (Windows)
          - os: macos-latest
            name: Tests (macOS)
          - os: ubuntu-latest
            name: Tests (Linux)
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      # Cache the installed packages, not just pip's wheel cache: unpacking
      # PySide6, OpenCV and SciPy was ~80 s of the job. Keyed on the exact
      # interpreter path (includes the patch version), both requirement files,
      # and the ISO week. Most requirements are floors, so without the week
      # stamp a hit would freeze whatever versions were resolved first, and a
      # later advisory against one of them would fail pip-audit on every run
      # with nothing in the repo to change. Rotating weekly bounds that to
      # seven days at the cost of one full install per week. No restore-keys
      # on purpose: a partial restore plus a non-upgrading install would keep
      # the stale versions anyway.
      - name: Cache key week stamp
        id: week
        shell: bash
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # site-packages and the scripts dir sit in different places per OS:
      # Windows uses Lib\site-packages + Scripts, POSIX lib/python3.x/site-packages
      # + bin. Resolved from the interpreter itself rather than hardcoded so a
      # patch bump can't silently miss the cache.
      - name: Resolve site-packages paths
        id: paths
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sysconfig
          purelib = sysconfig.get_path("purelib")
          scripts = sysconfig.get_path("scripts")
          print("purelib=" + purelib)
          print("scripts=" + scripts)
          PY
      - name: Restore installed packages
        id: site
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.paths.outputs.purelib }}
            ${{ steps.paths.outputs.scripts }}
          key: site-packages-${{ runner.os }}-${{ runner.arch }}-${{ env.pythonLocation }}-${{ steps.week.outputs.iso }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      # PySide6 needs libEGL and the xkb/X11 client libs even under the
      # offscreen platform plugin; ubuntu-latest images ship none of them.
      # Without this every Qt-touching test aborts before collection.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Install dependencies
        if: steps.site.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      # One audit is enough — the dependency set is the same on every runner,
      # and pip-audit hits the PyPI advisory API once per package.
      - name: Audit installed packages for known vulnerabilities
        if: runner.os == 'Windows'
        run: python -m pip_audit --progress-spinner off
      - name: Run tests
        # One worker per core (4 on windows-latest). Each worker is its own
        # process, so every worker gets its own QApplication.
        run: python -m pytest -m "not requires_camera and not requires_network" --timeout=300 -p no:cacheprovider -n auto
