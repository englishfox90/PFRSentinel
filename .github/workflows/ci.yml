name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and size audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: python -m pip install --quiet ruff
      - name: Ruff (syntax errors, undefined names, redefinitions)
        run: ruff check --output-format github .
      - name: File size caps
        run: python scripts/ci/check_file_sizes.py

  test:
    name: Tests and dependency audit (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      # Cache the installed packages, not just pip's wheel cache: unpacking
      # PySide6, OpenCV and SciPy was ~80 s of the job. Keyed on the exact
      # interpreter path (includes the patch version) and both requirement files.
      - name: Restore installed packages
        id: site
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}\Lib\site-packages
            ${{ env.pythonLocation }}\Scripts
          key: site-packages-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        if: steps.site.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit installed packages for known vulnerabilities
        run: python -m pip_audit --progress-spinner off
      - name: Run tests
        # One worker per core (4 on windows-latest). Each worker is its own
        # process, so every worker gets its own QApplication.
        run: python -m pytest -m "not requires_camera and not requires_network" --timeout=300 -p no:cacheprovider -n auto
