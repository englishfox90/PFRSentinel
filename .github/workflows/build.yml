name: Build

# Packaging, kept separate from ci.yml so a lint or test failure reports in
# seconds rather than behind a PyInstaller freeze.
#
# Two channels, which is what this project already means by the words:
#   dev        — DEV_MODE_AVAILABLE=True. Raw FITS/TIFF debug exports,
#                calibration JSON dumps and the ML prediction integration are
#                compiled in. What a pull request produces, so a reviewer can
#                download the change and dig into what it actually did.
#   production — DEV_MODE_AVAILABLE=False. What a v* tag produces.
# Manual dispatch picks either, defaulting to dev.
#
# Windows is the only platform that produces a shippable artifact today. macOS
# and Linux get a spec-parse smoke test instead: the packaging work for them
# (BUNDLE/.icns/notarization, .deb, the udev rule, ARM wheels) is issue #41, and
# uploading a half-built .app would look like a release that isn't one.
#
# Nothing here is code-signed, production channel included. The signing flow in
# build_sentinel.bat drives a Certum SimplySign token that needs a human to
# approve each request from a phone, which no runner can do. A tag build is a
# verified, reproducible candidate — not a releasable binary. Cut the real one
# locally with build_sentinel_installer.bat.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        type: choice
        options: [dev, production]
        default: dev
      installer:
        description: "Also build the Inno Setup installer"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      # A tag is a production build, a pull request is a dev build, and a
      # dispatch is whatever was asked for. Resolved once here so every step
      # below reads one value rather than re-deriving the rule.
      - name: Resolve the build channel
        id: channel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            channel="production"
          else
            channel="dev"
          fi
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          echo "Building the $channel channel"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # An installer named 3.7.7 built from a tree that says 3.7.6 is the exact
      # mistake build_sentinel_installer.bat already guards against downstream.
      # Catch it before anything is built rather than after.
      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(python -c 'import version; print(version.__version__)')"
          echo "tag=$tagged  version.py=$declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($declared)."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # Writes DEV_MODE_AVAILABLE into the source. The PFRSENTINEL_DEV_MODE
      # environment variable cannot stand in for this: it is read when the
      # module is imported, which for a frozen app is on the user's machine at
      # launch, so setting it here would change nothing about the artifact.
      - name: Stamp the build channel
        run: python scripts/ci/set_build_channel.py ${{ steps.channel.outputs.name }}

      # The plugin has no test suite and no linting of its own, so this build is
      # the only automated check that it still compiles. PFRSentinel.spec picks
      # the DLL up from nina_plugin/ if it is there and degrades gracefully if
      # not — but in CI the toolchain is always present, so a failure here is a
      # real break and should fail the job.
      - name: Build the NINA plugin
        run: |
          dotnet build nina-plugin\PFRSentinel.NINA\PFRSentinel.NINA.csproj `
            -c Release --nologo -p:LOCALAPPDATA=${{ runner.temp }}\nina-deploy

      - name: Stage the NINA plugin for bundling
        run: |
          $dll = "nina-plugin\PFRSentinel.NINA\bin\Release\net8.0-windows\PFRSentinel.NINA.dll"
          if (-not (Test-Path $dll)) {
            throw "Plugin build reported success but $dll is missing"
          }
          New-Item -ItemType Directory -Force -Path nina_plugin | Out-Null
          Copy-Item $dll nina_plugin\PFRSentinel.NINA.dll -Force

      - name: Check the spec before freezing it
        run: python scripts/ci/check_spec_parses.py

      - name: Build the executable
        run: python -m PyInstaller --noconfirm PFRSentinel.spec

      - name: Verify the built executable
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          $exe = "dist\PFRSentinel\PFRSentinel.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }

          # Asserting the version the binary actually carries costs nothing and
          # catches a spec that silently stopped applying version_info.
          $expected = (python -c "import version; print(version.__version__)").Trim()
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "version.py=$expected  exe FileVersion=$actual"
          if (-not $actual.StartsWith($expected)) {
            throw "Version mismatch: version.py says $expected, exe reports $actual"
          }

          # A production build missing the plugin ships an install button that
          # reports its own bundle as missing. Tolerable while iterating on a
          # PR, not in a release candidate.
          $plugin = "dist\PFRSentinel\_internal\nina_plugin\PFRSentinel.NINA.dll"
          if (-not (Test-Path $plugin)) {
            if ($env:CHANNEL -eq "production") { throw "NINA plugin DLL is not in the bundle" }
            Write-Warning "NINA plugin DLL is not in the bundle"
          }

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: PFRSentinel-windows-${{ steps.channel.outputs.name }}-unsigned
          path: dist/PFRSentinel/
          if-no-files-found: error
          # The bundle is several hundred MB. PR builds are a smoke test that
          # gets looked at the same day, if at all; tag builds are worth keeping.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}

      # Skipped on pull requests: Inno Setup takes minutes to install and
      # compile, and the artifact that matters for review is the app above.
      - name: Install Inno Setup
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.installer)
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.installer)
        run: |
          python scripts\update_version.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PFRSentinel.iss
          $setup = Get-ChildItem installer\dist\*.exe | Select-Object -First 1
          if (-not $setup) { throw "Inno Setup produced no installer" }
          Write-Host "Built $($setup.Name)"

      - name: Upload the installer
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.installer)
        uses: actions/upload-artifact@v4
        with:
          name: PFRSentinel-installer-${{ steps.channel.outputs.name }}-unsigned
          path: installer/dist/*.exe
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ steps.channel.outputs.name }} build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Channel | \`${{ steps.channel.outputs.name }}\` |"
            echo "| Dev features | $([ '${{ steps.channel.outputs.name }}' = dev ] && echo 'compiled in' || echo 'stripped') |"
            echo "| Code signing | none — sign locally before release |"
          } >> "$GITHUB_STEP_SUMMARY"

  spec:
    name: Spec parses (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # collect_all() imports the package it is collecting, and qfluentwidgets
      # pulls in Qt at import time. Without these the sweep degrades to a
      # warning and the check stops proving anything.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # Not a build. This executes every line of the spec outside Analysis with
      # the PyInstaller classes stubbed, which is what catches a Windows-only
      # import or a datas entry that only resolves on one OS — the class of
      # breakage that blocked the macOS and Linux ports (#38, #41).
      - name: Check the spec parses
        run: python scripts/ci/check_spec_parses.py
