name: Build

# Dev builds only. Kept separate from ci.yml so a lint or test failure reports
# in seconds rather than behind a PyInstaller freeze.
#
# Every artifact here is a dev build: DEV_MODE_AVAILABLE=True, so the raw
# FITS/TIFF debug exports, calibration JSON dumps and the ML prediction
# integration are compiled in. Download one from a pull request to see what a
# change actually did.
#
# There is deliberately NO production channel and no tag trigger. Production
# builds are signed, and signing cannot happen here: Connect-SimplySign.ps1
# drives the SimplySign Desktop GUI with synthetic keystrokes, which needs an
# interactive desktop session a hosted runner does not have, and CERTUM_OTP_URI
# is the TOTP seed for the signing identity — not something to hand to anyone
# who can trigger a workflow. An unsigned "production" artifact would be a
# release candidate nobody can release, so the release build stays local:
# build_sentinel_installer.bat, which signs the exe before Inno Setup packages
# it and signs the installer afterwards.
#
# Tags are not ignored: tag-pushed.yml checks version.py against the tag.
#
# Every merge to main (and a dispatch with `publish` ticked) also hands the
# installer to people without a GitHub login, which Actions artifacts cannot do
# (they need a login, expire, and arrive zipped). The publish-dev job replaces
# the single rolling dev prerelease and announces the build in one Discussions
# thread per release cycle. Names and text live in scripts/ci/dev_build_notes.py;
# the change list in dev_build_changelog.py; the thread in dev_build_discussion.py.
#
# Publishing is on merge, not on PR push. With several PRs open, "latest" would
# flip between unmerged branches, and Dependabot and fork PRs get a read-only
# token that cannot publish at all. PRs keep their per-run artifacts.
#
# Windows is the only platform that produces an artifact today. macOS and Linux
# get a spec-parse smoke test instead — the packaging work for them
# (BUNDLE/.icns/notarization, .deb, the udev rule, ARM wheels) is issue #41.

# Docs-only changes skip the build on both triggers: on a PR there is no binary
# change to review, and on main it would republish an identical binary and
# notify everyone subscribed to the discussion for nothing. Safe to skip
# because the "CI must pass" ruleset requires only ci.yml checks; a required
# check from this workflow would sit at "Expected" forever on a docs-only PR.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      installer:
        description: "Also build the Inno Setup installer"
        type: boolean
        default: true
      publish:
        description: "Publish the installer as the rolling dev prerelease (replaces the current one)"
        type: boolean
        default: false

permissions:
  contents: read

# Only PR runs cancel each other. Cancelling a main run could land mid-way
# through publish-dev's delete-then-create and leave no dev release at all;
# queued instead, the newest merge still publishes last.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  windows:
    name: Windows dev build
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      dev_version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: "1"
      # "true"/"false" strings. Main pushes always build it: publish-dev needs it.
      BUILD_INSTALLER: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.installer) }}
    steps:
      # Here rather than in publish-dev, so the mistake costs seconds instead
      # of a full freeze that then has nothing to publish.
      - name: Check the dispatch inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.installer
        run: throw "publish needs the installer - dispatch again with 'installer' ticked"

      # Full history and tags: the dev version counts commits since the last
      # release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # The committed value is False, so this is not a no-op — without it every
      # artifact here would be a production build wearing a dev label. The
      # PFRSENTINEL_DEV_MODE environment variable cannot stand in: it is read
      # when dev_mode_config is imported, which for a frozen app is on the
      # user's machine at launch, so setting it here would change nothing.
      - name: Stamp the dev channel
        run: python scripts/ci/set_build_channel.py dev

      # 3.7.7-dev.14 rather than the committed 3.7.6, so a tester's window
      # title, diagnostics bundle and analytics never pass for production.
      # Before the installer step: update_version.py reads it from version.py.
      - name: Stamp the dev version
        id: version
        run: python scripts/ci/set_dev_version.py

      # The plugin has no test suite and no linting of its own, so this build is
      # the only automated check that it still compiles.
      - name: Build the NINA plugin
        run: |
          dotnet build nina-plugin\PFRSentinel.NINA\PFRSentinel.NINA.csproj `
            -c Release --nologo -p:LOCALAPPDATA=${{ runner.temp }}\nina-deploy

      - name: Stage the NINA plugin for bundling
        run: |
          $dll = "nina-plugin\PFRSentinel.NINA\bin\Release\net8.0-windows\PFRSentinel.NINA.dll"
          if (-not (Test-Path $dll)) {
            throw "Plugin build reported success but $dll is missing"
          }
          New-Item -ItemType Directory -Force -Path nina_plugin | Out-Null
          Copy-Item $dll nina_plugin\PFRSentinel.NINA.dll -Force

      - name: Check the spec before freezing it
        run: python scripts/ci/check_spec_parses.py

      - name: Build the executable
        run: python -m PyInstaller --noconfirm PFRSentinel.spec

      - name: Verify the built executable
        run: |
          $exe = "dist\PFRSentinel\PFRSentinel.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }

          # Asserting the version the binary actually carries costs nothing and
          # catches a spec that silently stopped applying version_info.
          $info = (Get-Item $exe).VersionInfo
          $expectedFile = "${{ steps.version.outputs.file_version }}"
          $expectedProduct = "${{ steps.version.outputs.version }}"
          Write-Host "stamped=$expectedProduct  exe FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
          if ($info.FileVersion -ne $expectedFile) {
            throw "FileVersion mismatch: expected $expectedFile, exe reports $($info.FileVersion)"
          }
          if ($info.ProductVersion -ne $expectedProduct) {
            throw "ProductVersion mismatch: expected $expectedProduct, exe reports $($info.ProductVersion)"
          }

          # The plugin built and staged successfully by this point, so a DLL
          # missing from the bundle means the spec stopped picking it up.
          $plugin = "dist\PFRSentinel\_internal\nina_plugin\PFRSentinel.NINA.dll"
          if (-not (Test-Path $plugin)) { throw "NINA plugin DLL is not in the bundle" }

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: PFRSentinel-windows-dev-unsigned
          path: dist/PFRSentinel/
          if-no-files-found: error
          # The bundle is several hundred MB. A PR build gets looked at the same
          # day, if at all; one someone asked for by hand is worth keeping.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 7 }}

      # Skipped on pull requests: Inno Setup takes minutes to install and
      # compile, and the artifact that matters for review is the app above.
      # Every merge to main builds it for publish-dev, which also makes that
      # the regular exercise installer/PFRSentinel.iss gets.
      - name: Install Inno Setup
        if: env.BUILD_INSTALLER == 'true'
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        if: env.BUILD_INSTALLER == 'true'
        run: |
          python scripts\update_version.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PFRSentinel.iss
          $setup = Get-ChildItem installer\dist\*.exe | Select-Object -First 1
          if (-not $setup) { throw "Inno Setup produced no installer" }
          Write-Host "Built $($setup.Name)"

      - name: Upload the installer
        if: env.BUILD_INSTALLER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PFRSentinel-installer-dev-unsigned
          path: installer/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev build ${{ steps.version.outputs.version }}"
            echo
            echo "Dev features (raw FITS/TIFF exports, calibration JSON, ML"
            echo "prediction) are compiled in. Unsigned, so Windows SmartScreen"
            echo "will warn — this is a test build, not a release."
            echo
            echo "Release builds are cut locally with \`build_sentinel_installer.bat\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes only a build that is still the head of its branch. Creating the
  # dev-latest tag at a commit whose workflow files differ from the default
  # branch needs the `workflows` permission, which GITHUB_TOKEN can never hold,
  # so GitHub answers 403 "Resource not accessible by integration" — and by
  # then the previous dev release has already been deleted. That happens
  # whenever a workflow change merges while this build runs. A build that is
  # no longer the head is stale anyway, so it hands off to a fresh build of the
  # branch rather than publishing. The dispatch lands in the same concurrency
  # group and replaces any pending run there, so a burst of merges still ends
  # in one publish of the newest commit, even one that opted out of CI.
  # The same 403 still hits a manual publish from a branch that changes
  # workflow files; there is no token-free way round that. Its own job, so
  # publish-dev never holds actions: write.
  freshness:
    name: Check the build is still current
    needs: windows
    if: github.repository == 'englishfox90/PFRSentinel' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      current: ${{ steps.head.outputs.current }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Compare with the branch head
        id: head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME moved to ${head:0:7} while ${GITHUB_SHA:0:7} was building. Not publishing it; dispatched a fresh build of $GITHUB_REF_NAME instead."
          gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f installer=true -f publish=true

  # Separate job so the build never holds release-write rights: everything in
  # the windows job runs third-party build tooling under contents: read. The
  # repository check keeps a fork's own main pushes from trying to publish.
  publish-dev:
    name: Publish the dev prerelease
    needs: [windows, freshness]
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      discussions: write
    # The build concurrency group is per ref, so builds of two branches can
    # finish together. Replacing the release is delete-then-create, and two of
    # those interleaved would strand a tag or a second release.
    concurrency:
      group: dev-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEV_VERSION: ${{ needs.windows.outputs.dev_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the channel names
        run: python3 scripts/ci/dev_build_notes.py constants >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: PFRSentinel-installer-dev-unsigned
          path: staging

      # A fixed name keeps the download URL stable across builds. It also
      # avoids "setup", the word update_checker.py picks installers by.
      - name: Stage the installer under its stable name
        run: |
          shopt -s nullglob
          found=(staging/*.exe)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installer in the artifact, found ${#found[@]}"
            exit 1
          fi
          mv "${found[0]}" "staging/$DEV_ASSET_NAME"

      # Before the release is replaced: the previous dev-latest tag marks where
      # the last dev build stopped, which is what the discussion comment's
      # "new since the previous dev build" list is measured from.
      - name: Collect the changes in this build
        run: |
          python3 scripts/ci/dev_build_changelog.py --head "$GITHUB_SHA" \
            --previous-dev "$DEV_TAG" --full changelog.md --delta delta.md

      # Also before the release is touched, so a missing category fails while
      # the previous dev build is still downloadable.
      - name: Refresh this release cycle's discussion
        id: discussion
        run: |
          python3 scripts/ci/dev_build_discussion.py prepare --version "$DEV_VERSION"

      - name: Replace the dev prerelease
        env:
          DISCUSSION_URL: ${{ steps.discussion.outputs.url }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)
          echo "DEV_PR=$pr" >> "$GITHUB_ENV"
          notes=(--version "$DEV_VERSION" --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" --pr "$pr" --run-url "$RUN_URL")
          python3 scripts/ci/dev_build_notes.py release "${notes[@]}" \
            --discussion-url "$DISCUSSION_URL" --changelog-file changelog.md > release.md
          title=$(python3 scripts/ci/dev_build_notes.py title "${notes[@]}")

          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            gh release delete "$DEV_TAG" --cleanup-tag --yes
          fi
          # A tag left without its release (a run that died between delete and
          # create) would otherwise be reused where it stands, at the old commit.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DEV_TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$DEV_TAG"
          fi

          gh release create "$DEV_TAG" "staging/$DEV_ASSET_NAME" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$title" --notes-file release.md

      - name: Announce the build in the discussion
        env:
          DISCUSSION_ID: ${{ steps.discussion.outputs.id }}
        run: |
          python3 scripts/ci/dev_build_notes.py comment \
            --version "$DEV_VERSION" --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" --pr "$DEV_PR" \
            --run-url "$RUN_URL" --delta-file delta.md --changelog-file changelog.md > comment.md
          python3 scripts/ci/dev_build_discussion.py comment --id "$DISCUSSION_ID" --body-file comment.md

      - name: Summary
        env:
          DISCUSSION_URL: ${{ steps.discussion.outputs.url }}
        run: |
          {
            echo "### Dev prerelease $DEV_VERSION published"
            echo
            echo "- Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$DEV_TAG/$DEV_ASSET_NAME"
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$DEV_TAG"
            echo "- Discussion: $DISCUSSION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  spec:
    name: Spec parses (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # collect_all() imports the package it is collecting, and qfluentwidgets
      # pulls in Qt at import time. Without these the sweep degrades to a
      # warning and the check stops proving anything.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # Not a build. This executes every line of the spec outside Analysis with
      # the PyInstaller classes stubbed, which is what catches a Windows-only
      # import or a datas entry that only resolves on one OS — the class of
      # breakage that blocked the macOS and Linux ports (#38, #41).
      - name: Check the spec parses
        run: python scripts/ci/check_spec_parses.py
