name: Build

# Packaging, kept separate from ci.yml so a lint or test failure reports in
# seconds rather than behind a PyInstaller freeze.
#
# Windows is the only platform that produces a shippable artifact today. macOS
# and Linux get a spec-parse smoke test instead: the packaging work for them
# (BUNDLE/.icns/notarization, .deb, the udev rule, ARM wheels) is issue #41, and
# uploading a half-built .app would look like a release that isn't one.
#
# Nothing here is code-signed. The signing flow in build_sentinel.bat drives a
# Certum SimplySign token that needs a human to approve each request from a
# phone, which no runner can do. Tag builds are for testing; cut real releases
# locally with build_sentinel_installer.bat.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: "Also build the Inno Setup installer"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # The plugin has no test suite and no linting of its own, so this build is
      # the only automated check that it still compiles. PFRSentinel.spec picks
      # the DLL up from nina_plugin/ if it is there and degrades gracefully if
      # not — but in CI the toolchain is always present, so a failure here is a
      # real break and should fail the job.
      - name: Build the NINA plugin
        run: |
          dotnet build nina-plugin\PFRSentinel.NINA\PFRSentinel.NINA.csproj `
            -c Release --nologo -p:LOCALAPPDATA=${{ runner.temp }}\nina-deploy

      - name: Stage the NINA plugin for bundling
        run: |
          $dll = "nina-plugin\PFRSentinel.NINA\bin\Release\net8.0-windows\PFRSentinel.NINA.dll"
          if (-not (Test-Path $dll)) {
            throw "Plugin build reported success but $dll is missing"
          }
          New-Item -ItemType Directory -Force -Path nina_plugin | Out-Null
          Copy-Item $dll nina_plugin\PFRSentinel.NINA.dll -Force

      - name: Check the spec before freezing it
        run: python scripts/ci/check_spec_parses.py

      - name: Build the executable
        run: python -m PyInstaller --noconfirm PFRSentinel.spec

      # build_sentinel_installer.bat learned this the hard way: a stale exe left
      # in dist/ satisfied an existence check and shipped 3.7.3 inside a 3.7.4
      # installer. A clean runner cannot hit that, but asserting the version the
      # binary actually carries costs nothing and catches a spec that silently
      # stopped applying version_info.
      - name: Verify the built executable
        run: |
          $exe = "dist\PFRSentinel\PFRSentinel.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }
          $expected = (python -c "import version; print(version.__version__)").Trim()
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "version.py=$expected  exe FileVersion=$actual"
          if (-not $actual.StartsWith($expected)) {
            throw "Version mismatch: version.py says $expected, exe reports $actual"
          }
          if (-not (Test-Path "dist\PFRSentinel\_internal\nina_plugin\PFRSentinel.NINA.dll")) {
            Write-Warning "NINA plugin DLL is not in the bundle"
          }

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: PFRSentinel-windows-unsigned
          path: dist/PFRSentinel/
          # The bundle is several hundred MB. PR builds are a smoke test that
          # gets looked at the same day, if at all; tag builds are worth keeping.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}

      # Skipped on pull requests: Inno Setup takes minutes to install and
      # compile, and the artifact that matters for review is the app above.
      - name: Install Inno Setup
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.installer)
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.installer)
        run: |
          python scripts\update_version.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PFRSentinel.iss
          $setup = Get-ChildItem installer\dist\*.exe | Select-Object -First 1
          if (-not $setup) { throw "Inno Setup produced no installer" }
          Write-Host "Built $($setup.Name)"

      - name: Upload the installer
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.installer)
        uses: actions/upload-artifact@v4
        with:
          name: PFRSentinel-installer-unsigned
          path: installer/dist/*.exe
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}

  spec:
    name: Spec parses (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # collect_all() imports the package it is collecting, and qfluentwidgets
      # pulls in Qt at import time. Without these the sweep degrades to a
      # warning and the check stops proving anything.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # Not a build. This executes every line of the spec outside Analysis with
      # the PyInstaller classes stubbed, which is what catches a Windows-only
      # import or a datas entry that only resolves on one OS — the class of
      # breakage that blocked the macOS and Linux ports (#38, #41).
      - name: Check the spec parses
        run: python scripts/ci/check_spec_parses.py
