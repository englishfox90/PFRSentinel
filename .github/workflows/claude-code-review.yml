name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A new push to the same PR cancels the review still running on the old head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are not ready for review. Bot-authored PRs are skipped: Dependabot
    # gets its own assessment workflow (claude-dependabot-assess.yml) and no repo
    # secrets, and claude-code-action refuses any non-human actor ("Workflow
    # initiated by non-human actor"), which failed the job on every
    # claude-ci-fix.yml PR. This check is required on main, and a skipped job
    # counts as passing where a failed one would block the merge.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the plugin's git-blame/history reviewer has nothing
          # to read on a single-commit clone.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # The plugin launches its review agents in the background, then the
          # main session ends its turn to "wait" for them — which, under the
          # SDK, ends the run and kills them. The job still reported success
          # and posted nothing. Foreground agents block until they finish.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The plugin spawns Haiku/Sonnet sub-agents, reads the diff via `gh`,
          # and looks at blame/history. With only the inline-comment tool
          # allowed, every run died on the first denied call and posted nothing.
          claude_args: '--allowedTools "Agent,TodoWrite,Read,Grep,Glob,LS,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

