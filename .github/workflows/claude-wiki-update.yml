name: Claude Wiki Update

# For a freshly pushed version tag, Claude reads what changed since the previous
# tag and opens a pull request that brings docs/wiki/ up to date. It never touches
# the live wiki: docs/wiki/ is the source of truth, and wiki-publish.yml copies it to
# the GitHub wiki when that PR is merged. Merge the PR when you publish the
# release, so users never read about a version they cannot download yet.
#
# Chains off Tag Pushed like claude-release-notes.yml, for the same reasons:
# claude-code-action rejects `push` events, and a tag that disagrees with
# version.py should not produce documentation either.
#
# Claude only edits files. Committing, pushing and opening the PR happen in a
# script this workflow writes outside the checkout with the branch and base
# baked in, and Claude may run only that script, with no arguments. A
# `Bash(git push origin <branch>:*)` rule is a string-prefix match, so
# `git push origin <branch>:main` would pass it; the script leaves nothing to
# redirect. It runs inside the action, so `gh` uses the Claude app token rather
# than GITHUB_TOKEN: CI runs on the PR and the required checks can report.

on:
  workflow_run:
    workflows: ["Tag Pushed"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to update the wiki for (default: latest v* tag)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tag and its predecessor
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ] && [ -n "${RUN_SHA:-}" ]; then
            TAG=$(git tag --points-at "$RUN_SHA" | grep -E '^v[0-9]' | sort -V | tail -1 || true)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l 'v*' | sort -V | tail -1)
          fi
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::'$TAG' is not a version tag (v<digit>...)"; exit 1
          fi
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "Tag $TAG not found"; exit 1; }
          # grep exits 1 on no match; under pipefail that would abort here
          # instead of reaching the git describe fallback below.
          PREV=$(git tag -l 'v*' | sort -V | grep -B1 -x "$TAG" | head -1 || true)
          if [ -z "$PREV" ] || [ "$PREV" = "$TAG" ]; then
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          fi
          BRANCH="claude-wiki-update-${TAG}-${GITHUB_RUN_ID}"
          git config user.email "claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"
          # Branch from the tag, not main: the pages must describe the code that
          # shipped, and main may already carry unreleased work.
          git checkout -q -b "$BRANCH" "$TAG"
          [ -d docs/wiki ] || { echo "::error::docs/wiki/ does not exist at $TAG"; exit 1; }
          echo ".wiki-pr-body.md" >> .git/info/exclude

          OPEN_PR="$RUNNER_TEMP/open-wiki-pr.sh"
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            printf 'TAG=%q\nBRANCH=%q\n' "$TAG" "$BRANCH"
            cat <<'SCRIPT'
          cd "$GITHUB_WORKSPACE"
          body=.wiki-pr-body.md
          [ -s "$body" ] || { echo "Write the pull request body to $body first."; exit 1; }
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$BRANCH" ] || { echo "Not on $BRANCH."; exit 1; }
          git add -- docs/wiki
          if git diff --cached --quiet; then echo "No changes under docs/wiki/; nothing to open."; exit 1; fi
          if git diff --cached --name-only | grep -qv '^docs/wiki/'; then
            echo "Only docs/wiki/ may change."; exit 1
          fi
          git commit -q -m "docs(wiki): update for $TAG"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          label=()
          if gh label list --search documentation --json name --jq '.[].name' | grep -qx documentation; then
            label=(--label documentation)
          fi
          gh pr create --base main --head "$BRANCH" --title "docs(wiki): update for $TAG" --body-file "$body" "${label[@]}"
          SCRIPT
          } > "$OPEN_PR"
          chmod 500 "$OPEN_PR"
          {
            echo "tag=$TAG"
            echo "prev=$PREV"
            echo "branch=$BRANCH"
            echo "open_pr=$OPEN_PR"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG, previous $PREV, branch $BRANCH"

      - name: Update the wiki with Claude
        uses: anthropics/claude-code-action@v1
        env:
          # Background subagents die when the SDK session ends its turn, and
          # the job still passes. Same trap as claude-code-review.yml.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Bring the PFR Sentinel user wiki up to date for ${{ steps.tags.outputs.tag }}
            in ${{ github.repository }}. The previous release tag is
            ${{ steps.tags.outputs.prev }}. You are on branch ${{ steps.tags.outputs.branch }},
            created from that tag, so the working tree is the code that shipped.
            The wiki pages live in docs/wiki/ (one Markdown file per page;
            docs/wiki/_Sidebar.md is the navigation; links are written [Text](Page-Name)
            without .md).

            The wiki is for observatory owners using the app, not developers.

            1. Find what changed for users:
               `git log --no-merges --format='%h %s%n%b' ${{ steps.tags.outputs.prev }}..${{ steps.tags.outputs.tag }}`
               and `git diff --stat ${{ steps.tags.outputs.prev }}..${{ steps.tags.outputs.tag }} -- ui services ml`.
               Use `git show` and `gh pr view` / `gh issue view` where a subject is
               not self-explanatory. Ignore CI, tests, refactors, and performance
               work with no visible effect.
            2. For each user-visible change, find the wiki pages that describe that
               area (grep docs/wiki/ for the feature and its UI labels) and read them.
               A new feature with no home gets a new page, added to docs/wiki/_Sidebar.md
               and to the relevant table on docs/wiki/Home.md.
            3. Edit the pages. Verify every default, range, option and UI label you
               write against the working tree: services/config_defaults.py for
               defaults, ui/panels/ for labels, ranges, tooltips and visibility,
               ui/controllers/ and services/ for behaviour. Features only in dev
               builds (services/dev_mode_config.py) are not user features. If you
               cannot verify a claim, leave it out. Remove documentation for
               anything that was removed. Match the style of the page you edit:
               bold UI labels exactly as the widget spells them, settings tables,
               `---` between sections. No emojis, no file paths, no class names.
            4. Pages mark features that were on main but not yet released with the
               line "> **New in the next release** — not available in version X or
               earlier." For every such note whose feature is in this tag, remove the
               note (or, where the version matters to readers, replace it with
               "Added in version ${{ steps.tags.outputs.tag }}."). Leave notes for
               features that are still unreleased.
            5. Keep the diff focused: do not rewrite pages whose subject did not
               change, and do not reformat untouched sections.
            6. If nothing user-visible changed, stop there and say so in your final
               message. Do not write a pull request body.
            7. Otherwise write the pull request body to `.wiki-pr-body.md` at the
               repository root (it is not committed). List each page changed and the
               release change that required it, any claim you left out because you
               could not verify it, and any page whose screenshots or examples may now
               be stale. Say that merging publishes the wiki, so it should be merged
               when the release is published. Then run exactly
               `${{ steps.tags.outputs.open_pr }}` with no arguments. It commits
               docs/wiki/, pushes this branch and opens the pull request against main;
               you cannot commit or push any other way.

            Only edit files under docs/wiki/ (plus `.wiki-pr-body.md`).
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git tag:*),Bash(git describe:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(${{ steps.tags.outputs.open_pr }})"
